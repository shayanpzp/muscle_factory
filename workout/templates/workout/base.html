{% load static %}
<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Muscle Factory - {% block title %}{% endblock %}</title>

    <!-- ==================== FAVICON ==================== -->
    <link rel="icon" type="image/png" href="{% static 'workout/img/logo.png' %}">
    <link rel="shortcut icon" type="image/png" href="{% static 'workout/img/logo.png' %}">
    <!-- ================================================ -->

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css" rel="stylesheet">

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;700&display=swap" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'workout/css/styles.css' %}">

    {% block head %}{% endblock %}
  </head>

  <body class="bg-dark text-ice">

    <!-- ================= NAVBAR ================= -->
    <nav class="navbar navbar-expand-lg navbar-dark"
         style="background: linear-gradient(180deg,#000000 0%, #0b0b0b 100%);">

      <div class="container">

        <!-- فقط اسم برند -->
        <a class="navbar-brand fw-bold fs-4 text-gold" href="{% url 'workout:home' %}">
          Muscle Factory
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navMenu">
          <ul class="navbar-nav ms-auto align-items-center">
            <li class="nav-item"><a class="nav-link" href="{% url 'workout:home' %}">خانه</a></li>
            <li class="nav-item"><a class="nav-link" href="{% url 'workout:questionnaire' %}">دریافت برنامه</a></li>
          </ul>
        </div>

      </div>
    </nav>
    <!-- =========================================== -->

    <main class="container py-4">
      {% block content %}{% endblock %}
    </main>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    {% block scripts %}{% endblock %}
  </body>
</html>
